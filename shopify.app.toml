# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a2e6bdd412510b64ce32d28f2ca21e7e"
# Production URLs. The embedded merchant app is served from app.moonvella.com;
# the owner panel lives on admin.moonvella.com and is deliberately NOT a
# Shopify surface, so it appears in no Shopify configuration.
# This file is prepared but NOT deployed — `shopify app deploy` is a go-live
# step gated behind the Phase 15 checkpoint.
application_url = "https://app.moonvella.com"
embedded = true
name = "MoonVella"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# write_products / write_metaobjects / write_metaobject_definitions: already granted (catalog + app metafields).
# read_orders: receive and read orders for MoonVella item matching and rankings (60-day window by default).
# read/write_merchant_managed_fulfillment_orders: fulfillmentCreate requires one of the write fulfillment-order
#   scopes (NOT write_orders); merchant-managed covers fulfillments assigned to the merchant's own location.
# read/write_assigned_fulfillment_orders: needed when a fulfillment order is assigned to a specific location/service.
# write_inventory + read_locations: set inventory levels for imported variants at a location.
# write_files: upload product images to Shopify files.
# read_reports: ShopifyQL analytics (sales, sessions, visitors) for owner application review.
# write_fulfillments: create the MoonVella fulfillment service that owns MoonVella's stock. Without it
#   fulfillmentServiceCreate is refused with "Required access: write_fulfillments", and every order would
#   stay routed to the merchant's own "Shop location".
# write_locations: create and manage the location that fulfillment service owns. Without it there is
#   nowhere to hold MoonVella stock that is not the merchant's own shelf.
# NOT requested: write_orders (not required by fulfillmentCreate), read_all_orders (separate approval; 60-day
#   window only until granted).
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,write_fulfillments,write_locations,write_inventory,read_locations,write_files,read_reports"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

# THE ORDER SUBSCRIPTIONS. These are the fix for orders that never arrived.
#
# The merchant's orders did not appear in MoonVella because this block did not
# exist in any form: it was commented out, so Shopify had no subscription to
# deliver against and the app was never told an order had been placed. There is
# no code change that can compensate for a subscription that was never declared
# — the delivery has to be asked for.
#
# ORDER WEBHOOKS CARRY PROTECTED CUSTOMER DATA, and Shopify refuses to register
# them until the app is approved for it, with "This app is not approved to
# subscribe to webhook topics containing protected customer data." That refusal
# is a Partner Dashboard action, not a code change, and it is the one remaining
# prerequisite for live delivery. It is left ENABLED here deliberately: the
# registration attempts are how the app finds out the moment approval lands, and
# `ensureOrderWebhookSubscriptions` retries on a schedule rather than waiting for
# someone to remember. Commenting it out again would return the app to the state
# where it silently receives nothing.
#
# orders/paid IS subscribed, which it previously was not. A store can take
# payment asynchronously — a bank transfer, a manual capture, a gateway callback
# that lands a minute later — and for those orders the create carries no payment
# and the paid arrives separately. Without it, the seller's card is never
# charged for exactly the orders that took longest to confirm.
#
# refunds/create and fulfillment_orders/order_routing_complete are not optional
# extras: a refund is the only way MoonVella learns a customer was given their
# money back, and routing_complete is the earliest moment the fulfillment order
# this app must act on exists.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [
    "orders/create",
    "orders/paid",
    "orders/updated",
    "orders/cancelled",
    "refunds/create",
    "fulfillment_orders/order_routing_complete",
  ]

[auth]
# The callback path is derived from `authPathPrefix` in app/shopify.server.js:
# the framework registers `${authPathPrefix}/callback`, i.e. /auth/callback.
# This line previously read "/api/auth" — a leftover from the initial scaffold,
# which shipped the placeholder https://example.com/api/auth and had the path
# swapped for this host's without ever being checked against the app. No route
# serves /api/auth (there is no app/routes/api.* file; the router answers 404
# with "No route matches URL /api/auth"), so the OAuth callback would have been
# rejected against this allowlist. Verified against the deployed container.
redirect_urls = [ "https://app.moonvella.com/auth/callback" ]

[build]
# `include_config_on_deploy` used to sit here. CLI 4.8 removed the key — the
# config is always included on deploy now — and `shopify app deploy` rewrote
# this file to drop it, which is why it is gone rather than deleted by hand.
# Re-adding it does nothing.
#
# Set false deliberately. When true, running `shopify app dev` locally rewrites
# the Partner Dashboard URLs to a temporary tunnel address — which would take
# production down silently the next time anyone ran `npm run dev`. Production
# URLs must only ever change through a reviewed deploy.
automatically_update_urls_on_dev = false
